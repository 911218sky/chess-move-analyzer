name: Release Extensions

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version or tag name to publish, for example v1.0.1
        required: false
      target:
        description: Git ref to tag when manually creating a release
        required: false
        default: main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npm run check

      - name: Resolve Release Version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            TARGET="${GITHUB_SHA}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            TARGET="${{ github.event.inputs.target }}"
          else
            echo "Manual release requires a semantic version such as v1.0.1." >&2
            exit 1
          fi

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TARGET=${TARGET:-${GITHUB_SHA}}" >> "$GITHUB_ENV"

      - name: Assemble Release Notes
        shell: bash
        run: |
          sed "s/%version%/${VERSION}/g" RELEASE.HEAD.md > release_notes.md

      - name: Build Chrome Extension
        run: node tools/package-extension.js chrome "${VERSION}" --archive

      - name: Build Firefox Extension
        env:
          FIREFOX_EXTENSION_ID: ${{ vars.FIREFOX_EXTENSION_ID }}
          FIREFOX_UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download/firefox-updates.json
          FIREFOX_XPI_DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/latest/download/chess-move-analyzer.firefox.xpi
        run: node tools/package-extension.js firefox "${VERSION}" --archive

      - name: Create Git Tag For Manual Release
        if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git rev-parse "${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists."
            exit 0
          fi

          git tag "${VERSION}" "${TARGET}"
          git push origin "refs/tags/${VERSION}"

      - name: Publish GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=(
            "dist/build/chess-move-analyzer_${VERSION}.chrome.zip"
            "dist/build/chess-move-analyzer_${VERSION}.firefox.xpi"
            "dist/build/chess-move-analyzer.firefox.xpi"
          )

          if [[ -f "dist/build/firefox-updates.json" ]]; then
            ASSETS+=("dist/build/firefox-updates.json")
          fi

          gh release create "${VERSION}" \
            "${ASSETS[@]}" \
            --title "${VERSION}" \
            --notes-file release_notes.md
