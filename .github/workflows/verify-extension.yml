name: Verify Extension

on:
  pull_request:
  push:
    branches:
      - '**'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Verify TypeScript Build
        run: npm run verify

      - name: Smoke Test Chrome Package
        run: npm run package:chrome
