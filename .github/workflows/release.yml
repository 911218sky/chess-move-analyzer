name: Release Extensions

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version for a manual release, for example v1.0.1
        required: false
      target:
        description: Git ref to release when manually creating a release
        required: false
        default: main
      branch_name:
        description: Optional branch label to append to archive names
        required: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npm run check

      - name: Resolve Release Metadata
        id: meta
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          SHORT_SHA="${GITHUB_SHA::7}"

          sanitize_branch() {
            echo "$1" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+|-+$//g'
          }

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            TARGET="${GITHUB_SHA}"
            BRANCH_LABEL="tag"
            BRANCH_NAME="${GITHUB_REF_NAME}"
            RELEASE_TAG="${VERSION}"
            RELEASE_TITLE="${VERSION}"
            COMPARE_TARGET=""
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            TARGET="${{ github.event.inputs.target }}"
            RAW_BRANCH="${{ github.event.inputs.branch_name }}"
            if [[ -z "${RAW_BRANCH}" ]]; then
              RAW_BRANCH="${GITHUB_REF_NAME}"
            fi
            BRANCH_NAME="${RAW_BRANCH}"
            BRANCH_LABEL="$(sanitize_branch "${RAW_BRANCH}")"
            RELEASE_TAG="${VERSION}-${BRANCH_LABEL}-${SHORT_SHA}"
            RELEASE_TITLE="${VERSION} (${BRANCH_LABEL})"
            COMPARE_TARGET="${TARGET}"
          else
            VERSION="${PACKAGE_VERSION}.${GITHUB_RUN_NUMBER}"
            TARGET="${GITHUB_SHA}"
            BRANCH_NAME="${GITHUB_REF_NAME}"
            BRANCH_LABEL="$(sanitize_branch "${GITHUB_REF_NAME}")"
            RELEASE_TAG="build-${BRANCH_LABEL}-${SHORT_SHA}"
            RELEASE_TITLE="Build ${BRANCH_LABEL} ${SHORT_SHA}"
            COMPARE_TARGET="${GITHUB_REF_NAME}"
          fi

          if [[ -z "${BRANCH_LABEL}" ]]; then
            BRANCH_LABEL="build"
          fi

          CHROME_ASSET="chess-move-analyzer_${VERSION}_${BRANCH_LABEL}.chrome.zip"
          FIREFOX_ASSET="chess-move-analyzer_${VERSION}_${BRANCH_LABEL}.firefox.xpi"

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TARGET=${TARGET}" >> "$GITHUB_ENV"
          echo "BRANCH_NAME=${BRANCH_NAME}" >> "$GITHUB_ENV"
          echo "BRANCH_LABEL=${BRANCH_LABEL}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=${RELEASE_TITLE}" >> "$GITHUB_ENV"
          echo "COMPARE_TARGET=${COMPARE_TARGET}" >> "$GITHUB_ENV"
          echo "CHROME_ASSET=${CHROME_ASSET}" >> "$GITHUB_ENV"
          echo "FIREFOX_ASSET=${FIREFOX_ASSET}" >> "$GITHUB_ENV"

      - name: Assemble Release Notes
        shell: bash
        run: |
          {
            echo "Branch: ${BRANCH_NAME}"
            echo "Commit: ${GITHUB_SHA}"
            echo
            if [[ -n "${COMPARE_TARGET}" ]]; then
              echo "[Commits to ${BRANCH_NAME} since this release](https://github.com/${GITHUB_REPOSITORY}/compare/${RELEASE_TAG}...${COMPARE_TARGET})"
              echo
            fi
            if [[ -f RELEASE.HEAD.md ]]; then
              sed \
                -e "s|%version%|${VERSION}|g" \
                -e "s|%branch_name%|${BRANCH_NAME}|g" \
                -e "s|%release_tag%|${RELEASE_TAG}|g" \
                -e "s|%chrome_asset%|${CHROME_ASSET}|g" \
                -e "s|%firefox_asset%|${FIREFOX_ASSET}|g" \
                RELEASE.HEAD.md
            fi
          } > release_notes.md

      - name: Build Chrome Extension
        run: node tools/package-extension.js chrome "${VERSION}" --archive --archive-label "${BRANCH_LABEL}"

      - name: Build Firefox Extension
        run: node tools/package-extension.js firefox "${VERSION}" --archive --archive-label "${BRANCH_LABEL}"

      - name: Publish GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=(
            "dist/build/${CHROME_ASSET}"
            "dist/build/${FIREFOX_ASSET}"
          )

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release delete "${RELEASE_TAG}" --yes
          fi

          gh release create "${RELEASE_TAG}" \
            "${ASSETS[@]}" \
            --target "${TARGET}" \
            --title "${RELEASE_TITLE}" \
            --notes-file release_notes.md
